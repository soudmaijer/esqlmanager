name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-latest # Apple Silicon
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-commit-id-maven-plugin needs the history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Icon tools
        run: brew install librsvg

      # The package profile builds the jlink runtime image itself (src/package/jpackage.sh)
      - name: Build the dmg
        run: ./mvnw -B -DskipTests -Ppackage package -Djpackage.type=dmg

      - name: Name the dmg
        id: dmg
        run: |
          src=$(ls target/dist/eSQLManager-*.dmg)
          version=$(basename "$src" .dmg | sed 's/^eSQLManager-//')
          dmg="target/dist/eSQLManager-${version}-arm64.dmg"
          mv "$src" "$dmg"
          echo "file=$dmg" >> "$GITHUB_OUTPUT"

      - name: Keep the dmg as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eSQLManager-dmg
          path: ${{ steps.dmg.outputs.file }}

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The newest entry is the first block of changelog.txt, up to the next dated header
          awk '/^[0-9][0-9]-[0-9][0-9]-[0-9][0-9][0-9][0-9]:/ { n++ } n == 1' changelog.txt > release-notes.md
          cat >> release-notes.md <<'NOTES'

          ## Opening the app

          The app is not signed or notarized. After opening the dmg and dragging eSQLManager to Applications, right
          click it and choose Open the first time, or run:

          ```
          xattr -dr com.apple.quarantine /Applications/eSQLManager.app
          ```
          NOTES

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease --draft" ;; esac
          gh release create "$GITHUB_REF_NAME" "${{ steps.dmg.outputs.file }}" \
            --title "eSQLManager $GITHUB_REF_NAME" --notes-file release-notes.md $flags
